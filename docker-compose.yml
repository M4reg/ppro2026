services:
  db:
    image: postgres:16-alpine
    container_name: drevenka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: drevenka_db
      POSTGRES_USER: drevenka_user
      POSTGRES_PASSWORD: drevenka_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drevenka_user -d drevenka_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drevenka_web
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=drevenka_db;Username=drevenka_user;Password=drevenka_pass
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
